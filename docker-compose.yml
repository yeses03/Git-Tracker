# Local development database:  docker compose up -d
# Then in .env:  DATABASE_URL and DIRECT_URL = postgresql://postgres:postgres@localhost:5432/gittracker
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: gittracker
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
